name: Palabra Arena CI - UX and Cloudflare
on:
  push:
    branches:
      - candidate/cloudflare-0.2.3
      - candidate/ux-0.2.4
      - candidate/visual-cleanup-0.2.5
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 11_PRODUCTION/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test API, rooms and Worker configuration
        run: npm test
      - name: Build React SPA
        run: npm run build
      - name: Install Chromium for responsive functional checks
        run: npx playwright install --with-deps chromium
      - name: Real browser functional and responsive UX
        run: npm run test:ui
      - name: Store browser evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ux-evidence
          path: 11_PRODUCTION/web/test-results/
      - name: Package Cloudflare Worker without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/qa
